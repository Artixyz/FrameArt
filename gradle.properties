group=dev.frameart
version=1.0.0

# Versão do Java (toolchain + bytecode). O Minecraft 26.x exige Java 25.
# O código usa apenas recursos até o Java 17, então é possível baixar para 21/17
# caso precise rodar um servidor 1.8–1.20 em uma JVM mais antiga.
javaVersion=25

# API usada para compilar o núcleo Bukkit e o adaptador legado (1.8 – 1.12.2).
legacyApiVersion=1.8.8-R0.1-SNAPSHOT
# API usada para compilar o adaptador moderno (1.13 – 26.x).
modernApiVersion=1.21.4-R0.1-SNAPSHOT

junitVersion=5.11.4

org.gradle.caching=true
org.gradle.parallel=true
